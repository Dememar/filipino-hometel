<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment | Filipino Hometel</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/payment.css" />
    <link rel="stylesheet" href="css/desktop.css" />
  </head>
  <body>
    <nav class="header">
      <a href="index.html" class="logo">
        <img src="pics/logo.png" alt="Company Logo" />
        <h1>Filipino Hometel</h1>
      </a>

      <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="contact.html">Contact Us</a>
        <a href="about.html">About Us</a>
        <a href="login.html">Logout</a>
      </div>
    </nav>
    <section class="payment-mode">
      <i id="status-symbol" class="fa-sharp fa-solid fa-arrows-rotate"></i>
      <i id="status-symbol2" class="fa-sharp fa-solid fa-check"></i>
      <!-- Payment status -->
      <div id="status" class="pending">Payment - Pending</div>

      <!-- User details -->
      <div id="payment-details" class="details" style="display: block">
        <p><strong>Name:</strong> <span id="userName"></span></p>
        <p><strong>Room Type:</strong> <span id="roomType"></span></p>
        <p><strong>Number of Guests:</strong> <span id="guests"></span></p>
        <p><strong>Check-in:</strong> <span id="checkin"></span></p>
        <p><strong>Check-out:</strong> <span id="checkout"></span></p>
        <p><strong>Total:</strong> ₱<span id="total"></span></p>

        <label for="paymentMode"><strong>Select Payment Mode:</strong></label>
        <select id="paymentMode" required>
          <option value="" disabled selected>Select mode</option>
          <option value="Credit Card">Credit Card</option>
          <option value="PayPal">PayPal</option>
          <option value="GCash">GCash</option>
        </select>
        <div id="creditCardField" style="display: none">
          <input type="number" placeholder="Enter Card Number" />
        </div>

        <div id="paypalField" style="display: none">
          <input type="email" placeholder="Enter PayPal Email" />
        </div>

        <div id="gcashField" style="display: none">
          <input type="text" placeholder="Enter GCash Mobile Number" />
        </div>
      </div>

      <div
        id="thankYouMessage"
        style="display: none; text-align: center; margin-top: 20px"
      >
        <h2 id="thankYouText"></h2>
      </div>
      <!-- Checkout button -->
      <button id="checkoutBtn">Proceed to Checkout</button>
    </section>

    <footer>
      <nav>
        <a class="footer-link" href="contact.html">Contact Us</a>
        <a class="footer-link" href="rooms.html#book-button1">Book Now</a>
        <a class="footer-link" href="about.html">About Us</a>
      </nav>
      <p>&copy; 2026 Filipino Hometel. All rights reserved.</p>
      <p>Designed by <em>Dememar Solomon</em> and <em>Cahren Sagrit</em>.</p>
      <div class="watermark">
        <img src="pics/logo.png" alt="Kubo Watermark" />
      </div>
    </footer>

    <script src="js/index.js" defer></script>
  </body>
</html>
